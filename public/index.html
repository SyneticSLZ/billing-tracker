<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Billing Tracker</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/table.css">
<link rel="stylesheet" href="/css/drilldown.css">
<link rel="stylesheet" href="/css/modal.css">
<link rel="stylesheet" href="/css/clients.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="display:none">
  <div class="login-card">
    <h2>Billing Tracker</h2>
    <p>Connect your Microsoft 365 account to pull emails, meetings, Teams messages, and generate billing-ready entries.</p>
    <div class="source-badges">
      <span class="badge badge-email">Email</span>
      <span class="badge badge-teams">Teams</span>
      <span class="badge badge-calls">Calls</span>
      <span class="badge badge-meeting-type">Meetings</span>
    </div>
    <button class="ms-btn" onclick="appLogin()">
      Sign in with Microsoft 365
    </button>
    <p style="font-size:11px;color:var(--muted);margin-top:16px;margin-bottom:0">GoDaddy-hosted Microsoft accounts supported</p>
  </div>
</div>

<!-- APP CONTAINER -->
<div id="app-container" style="display:none">
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">B</div>
      <div>
        <h1>Billing Tracker</h1>
        <span>Dashboard</span>
      </div>
    </div>
    <div class="header-right">
      <input type="text" class="global-search" placeholder="Search entries..." id="global-search">
      <div id="user-info">
        <span id="user-name"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn" style="display:none" onclick="appLogout()">Sign Out</button>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>
    <div class="content-area" id="view-container"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>Edit Billing Entry</h3>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Client Name</label>
      <input type="text" id="edit-client" placeholder="e.g. Acme Corp">
    </div>
    <div class="form-group">
      <label>Activity Description</label>
      <textarea id="edit-description" placeholder="e.g. Email correspondence re: regulatory strategy"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label>Date</label>
        <input type="text" id="edit-date">
      </div>
      <div class="form-group">
        <label>Duration (Hours)</label>
        <input type="number" id="edit-duration" step="0.1" min="0.1">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label>Start Time</label>
        <input type="text" id="edit-start" placeholder="9:00 AM">
      </div>
      <div class="form-group">
        <label>End Time</label>
        <input type="text" id="edit-end" placeholder="9:30 AM">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditEntry()">Save Changes</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
